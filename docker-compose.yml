services:
  db:
    image: postgres:16-alpine
    container_name: chill-zone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chill_zone}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5430:5432"
    volumes:
      - chill_zone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${POSTGRES_DB:-chill_zone}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chill-zone-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-chill_zone}
    volumes:
      - ./.env:/app/app/build/install/app/.env:ro

volumes:
  chill_zone_pgdata:
